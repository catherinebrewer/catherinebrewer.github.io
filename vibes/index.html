<html>
<head>
    <meta name="robots" content="noindex, nofollow">
</head>
    <title> 2026 vibes </title>
    <h1>2026 vibes</h1>
    inspired by <a href="https://www.xavicf.com/vibes">Xavi</a>, <a href="https://guzey.com/vibes/">Guzey</a>, and <a href="https://girl.surgery/website_vibes/">Sophia</a>; <a href="https://gist.github.com/sophiawisdom/c1b16fcaca017d1aec2358c6fb619697">make your own</a>.

    <!-- Add any text here if you so desire; the images won't be drawn over it. -->
    <div id="container">
    </div>
    <script>

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

fetch("image_widths_heights.json").then(f => {
    if (f.status == 404) {
        alert("unable to find image_widths_heights.json -- you should run lister.py to create it.");
    }
    return f.json()
}).then(data => {
    let key_values = shuffleArray(data);

    const rect = container.getBoundingClientRect();
    let screen_width = rect.width;

    // By default I will have a lot of images that are just enormous and take up most of the screen. Here I attempt
    // to resize the images to be approximately a similar size.
    // To adjust image size, change goal_pixels here.
    const pairs = key_values.map(([key, [w, h]]) => {
        let goal_pixels = 500*300;
        let actual_pixels = w*h;
        if (actual_pixels/goal_pixels > 16) {
            return [parseInt(w/8), parseInt(h/8)];
        }
        if (actual_pixels/goal_pixels > 4) {
            return [parseInt(w/4), parseInt(h/4)];
        }
        return [parseInt(w/2), parseInt(h/2)];
    }).map(([w, h]) => [(w+10) > screen_width ? screen_width-10 : w, h]);

    // gather all the text nodes so the images don't intersect them. The images are
    // absolutely positioned, so they never push the text around -- measure each one
    // once up front rather than re-measuring inside the placement loop, which would
    // force the browser to redo layout thousands of times.
    const textNodes = [];
    const treeWalker = document.createTreeWalker(
        document.body,
        NodeFilter.SHOW_TEXT,
        { acceptNode: (node) => node.textContent.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT }
    );
    while(treeWalker.nextNode()) textNodes.push(treeWalker.currentNode);

    const textBoxes = textNodes.map(node => {
        const range = document.createRange();
        range.selectNodeContents(node);
        const rect = range.getBoundingClientRect();
        return {
            left: rect.left + window.pageXOffset,
            top: rect.top + window.pageYOffset,
            right: rect.left + window.pageXOffset + rect.width,
            bottom: rect.top + window.pageYOffset + rect.height,
        };
    });

    // Now we attempt to place images. I looked at some actually good algorithms but decided to instead use a stupid
    // algorithm: for each image, attempt to place it in a random location up to height 600. if it intersects with
    // any other images, try again. If after 50 attempts at random placing we don't manage to place it, increase the
    // height by 50.
    let positions = [];
    let i = 0;
    // the images appear one at a time, every 100ms -- that gradual reveal is the
    // look of the thing, so it stays. Change the 100 at the bottom to retime it.
    let interval = setInterval(() => {
        let height = 600;
        let [w, h] = pairs[i];
        while (1) {
            let found_place = false;
            let w_max = screen_width-w;
            let h_max = height-h;
            for (let _ = 0; _ < 50; _++) {
                let a_left = Math.random() * w_max;
                let a_top = Math.random() * h_max;
                let a_right = a_left+w;
                let a_bottom = a_top+h;

                // do intersection checks against images
                let intersects = false;
                for (let j = 0; j < positions.length; j++) {
                    let [b_left, b_top] = positions[j];
                    let b_right = b_left + pairs[j][0];
                    let b_bottom = b_top + pairs[j][1];
                    if (a_left < b_right && a_right > b_left && a_bottom > b_top && a_top < b_bottom) {
                        intersects = true;
                        break;
                    }
                }

                // do intersection checks against text, using the rects measured above
                for (const box of textBoxes) {
                    if (a_left < box.right && a_right > box.left && a_bottom > box.top && a_top < box.bottom) {
                        intersects = true;
                        break;
                    }
                }

                if (!intersects) {
                    found_place = true;
                    positions.push([parseInt(a_left), parseInt(a_top)]);
                    break;
                }
            }
            if (found_place) {
                break;
            } else {
                height += 50;
            }
        }

        // Create the image
        let img = document.createElement("img");
        // Serve the small WebP copy from thumbs/ (made by make_thumbs.py). If there
        // isn't one -- animated gifs, images already small enough, anything added
        // since the last run -- fall back to the original file.
        let original = key_values[i][0];
        img.onerror = () => { img.onerror = null; img.src = original; };
        img.src = "thumbs/" + original + ".webp";
        img.width = pairs[i][0];
        img.height = pairs[i][1];
        img.style.width = pairs[i][0];
        img.style.height = pairs[i][1];
        img.style.position = "absolute";
        img.style.top = positions[i][1];
        img.style.left = positions[i][0];
        img.loading = "lazy";
        img.decoding = "async";
        container.appendChild(img);

        i++;
        if (i == key_values.length) {
            clearInterval(interval);
        }
    }, 100);
})
    </script>
</html>
