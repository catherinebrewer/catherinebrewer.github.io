<!-- Dark/light mode toggle button (top-right corner, fixed position).
     The ◐ symbol switches to ◑ dynamically via JS — or you can change it here.
     Styling is in assets/css/style.css under .theme-toggle -->
<button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
    <span class="theme-icon">◐</span>
</button>
