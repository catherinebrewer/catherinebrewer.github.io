<script>
(function () {
  var SIDENOTE_MARGIN    = 20;   // px gap between content right edge and sidenote
  var SIDENOTE_MIN_WIDTH = 120;  // don't bother if less space than this
  var SIDENOTE_MAX_WIDTH = 220;  // cap width even on huge monitors
  var SIDENOTE_GAP       = 8;    // minimum vertical gap between stacked sidenotes

  function init() {
    var footnotes = document.querySelector('.footnotes');
    if (!footnotes) return;

    function update() {
      clearSidenotes();
      createSidenotes(footnotes);
    }

    // Wait for full load so images have settled (affects vertical positions)
    if (document.readyState === 'complete') {
      update();
    } else {
      window.addEventListener('load', update);
    }

    // Recompute on resize (debounced)
    var timer;
    window.addEventListener('resize', function () {
      clearTimeout(timer);
      timer = setTimeout(update, 150);
    });
  }

  function clearSidenotes() {
    document.querySelectorAll('.sidenote').forEach(function (el) { el.remove(); });
    var fn = document.querySelector('.footnotes');
    if (fn) fn.classList.remove('sidenotes-active');
  }

  function createSidenotes(footnotes) {
    var postContent = document.querySelector('.post-content');
    if (!postContent) return;

    // Measure the right edge of the text column
    var refEl = postContent.querySelector('p, h2, h3, h4, ul, ol, blockquote');
    if (!refEl) return;

    var contentRight   = refEl.getBoundingClientRect().right;
    var availableWidth = window.innerWidth - contentRight - SIDENOTE_MARGIN;

    if (availableWidth < SIDENOTE_MIN_WIDTH) return; // not enough room

    var snWidth = Math.min(availableWidth, SIDENOTE_MAX_WIDTH);
    var snLeft  = contentRight + SIDENOTE_MARGIN;

    var lastBottom   = 0;
    var fnItems      = footnotes.querySelectorAll('ol > li');
    var supRefs      = document.querySelectorAll('sup[id^="fnref:"]');

    supRefs.forEach(function (sup, i) {
      var fnItem = fnItems[i];
      if (!fnItem) return;

      var num = (sup.querySelector('a') || {}).textContent || (i + 1);

      // Clone footnote content, strip the ↩ back-link
      var clone = fnItem.cloneNode(true);
      var backref = clone.querySelector('.reversefootnote');
      if (backref) {
        var prev = backref.previousSibling;
        if (prev && prev.nodeType === 3) prev.parentNode.removeChild(prev);
        backref.parentNode.removeChild(backref);
      }
      // Unwrap a single wrapping <p>
      var tmp = document.createElement('div');
      tmp.innerHTML = clone.innerHTML.trim();
      var html = (tmp.children.length === 1 && tmp.children[0].tagName === 'P')
        ? tmp.children[0].innerHTML.trim()
        : tmp.innerHTML.trim();

      var div = document.createElement('div');
      div.className = 'sidenote';
      div.innerHTML = '<sup class="sidenote-num">' + num + '</sup>\u2009' + html;

      // Hover: highlight sidenote when its reference is hovered
      sup.addEventListener('mouseenter', function () { div.classList.add('sidenote-highlight'); });
      sup.addEventListener('mouseleave', function () { div.classList.remove('sidenote-highlight'); });

      // Vertical position: align with sup, push down if overlapping previous sidenote
      var supTop = sup.getBoundingClientRect().top + window.scrollY;
      var top    = Math.max(lastBottom + SIDENOTE_GAP, supTop);

      div.style.left  = snLeft + 'px';
      div.style.top   = top + 'px';
      div.style.width = snWidth + 'px';

      document.body.appendChild(div);
      lastBottom = top + div.getBoundingClientRect().height;
    });

    footnotes.classList.add('sidenotes-active');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
}());
</script>
